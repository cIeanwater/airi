name: Test Local Windows Launcher

on:
  push:
    branches:
      - main
    paths:
      - Start-Humanning.cmd
      - scripts/start-local-voice.py
      - scripts/test-local-voice-launcher.py
      - scripts/serve-local-gemma.py
      - scripts/test-local-gemma-gateway.py
      - scripts/serve-local-gpt-sovits.py
      - scripts/test-local-gpt-sovits.py
      - scripts/serve-qwen35-2b-bf16.py
      - scripts/test-local-chat-output.py
      - scripts/local-message-context.py
      - scripts/test-local-message-context.py
      - .github/workflows/test-local-launcher.yml
  pull_request:
    branches:
      - main
    paths:
      - Start-Humanning.cmd
      - scripts/start-local-voice.py
      - scripts/test-local-voice-launcher.py
      - scripts/serve-local-gemma.py
      - scripts/test-local-gemma-gateway.py
      - scripts/serve-local-gpt-sovits.py
      - scripts/test-local-gpt-sovits.py
      - scripts/serve-qwen35-2b-bf16.py
      - scripts/test-local-chat-output.py
      - scripts/local-message-context.py
      - scripts/test-local-message-context.py
      - .github/workflows/test-local-launcher.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    name: Windows launcher without terminal PATH
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run launcher regressions
        run: python -B scripts/test-local-voice-launcher.py -v
      - name: Run local protocol regressions without model weights
        run: |
          python -B scripts/test-local-chat-output.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/test-local-message-context.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/test-local-gemma-gateway.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/test-local-gpt-sovits.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
